<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jesteś obrażona?</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --card: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.14);
        --text: #f8fafc;
        --accent: #f59e0b;
        --accent-2: #fb7185;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(245, 158, 11, 0.18), transparent 28%),
          radial-gradient(circle at bottom right, rgba(251, 113, 133, 0.16), transparent 24%),
          linear-gradient(160deg, #020617, var(--bg));
        padding: 24px;
      }

      .card {
        width: min(680px, 100%);
        padding: 36px;
        border-radius: 30px;
        border: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.4);
        text-align: center;
      }

      h1 {
        margin: 0 0 24px;
        font-size: clamp(2.6rem, 8vw, 5rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      .answers {
        position: relative;
        min-height: 150px;
      }

      .answers.confirm {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
      }

      .result {
        display: none;
        margin-top: 10px;
        font-size: clamp(1.4rem, 4vw, 2rem);
        font-weight: 700;
      }

      .result.show {
        display: block;
      }

      .bubble,
      .arrow {
        display: none;
      }

      .bubble {
        position: fixed;
        top: 22px;
        right: 22px;
        z-index: 20;
        padding: 14px 18px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 16px 30px rgba(0, 0, 0, 0.24);
        font-weight: 700;
        letter-spacing: 0.01em;
        backdrop-filter: blur(12px);
        animation: bubblePulse 1.2s ease-in-out infinite;
        pointer-events: none;
      }

      .bubble::after {
        content: "";
        position: absolute;
        right: 18px;
        bottom: -9px;
        width: 16px;
        height: 16px;
        background: inherit;
        border-right: 1px solid rgba(255, 255, 255, 0.18);
        border-bottom: 1px solid rgba(255, 255, 255, 0.18);
        transform: rotate(45deg);
      }

      .arrow {
        position: fixed;
        z-index: 20;
        right: 138px;
        top: 50%;
        transform: translateY(-50%);
        font-size: clamp(2.8rem, 6vw, 4.8rem);
        font-weight: 900;
        color: #f8fafc;
        text-shadow: 0 0 18px rgba(255, 255, 255, 0.18);
        animation: arrowNudge 0.9s ease-in-out infinite;
      }

      .yes.escaped {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 15;
        margin-right: 0;
        transform: none;
        animation: escapeLeft 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .yes.escaped:hover {
        transform: none;
      }

      .show {
        display: block;
      }

      button {
        min-width: 120px;
        border: 0;
        border-radius: 999px;
        padding: 14px 24px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
      }

      .yes {
        position: absolute;
        left: 24px;
        top: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #111827;
        box-shadow: 0 16px 34px rgba(245, 158, 11, 0.24);
      }

      .no {
        position: absolute;
        right: 24px;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      button:hover {
        transform: translateY(-2px);
      }

      @keyframes escapePulse {
        0%,
        100% {
          box-shadow: 0 16px 34px rgba(245, 158, 11, 0.22), 0 0 0 0 rgba(251, 113, 133, 0.28);
          filter: brightness(1);
        }
        50% {
          box-shadow: 0 16px 34px rgba(245, 158, 11, 0.34), 0 0 0 14px rgba(251, 113, 133, 0);
          filter: brightness(1.06);
        }
      }

      @keyframes escapeLeft {
        0% {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate3d(-140vw, 0, 0);
        }
      }

      @keyframes bubblePulse {
        0%,
        100% {
          opacity: 0.9;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes arrowNudge {
        0%,
        100% {
          transform: translateY(-50%) translateX(0);
        }
        50% {
          transform: translateY(-50%) translateX(-8px);
        }
      }

      .bubble.ride {
        animation: bubbleRide 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      @keyframes bubbleRide {
        0% {
          opacity: 0;
          transform: translate3d(0, 0, 0) scale(0.98);
        }
        20% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate3d(-140vw, 0, 0) scale(0.98);
        }
      }

      @media (max-width: 480px) {
        .card {
          padding: 24px;
          border-radius: 24px;
        }

        button {
          min-width: 100px;
          padding: 12px 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 id="question">Jesteś obrażona?</h1>
      <div class="answers" aria-label="Odpowiedzi">
        <button class="yes" id="yesBtn" type="button">Tak</button>
        <button class="no" id="noBtn" type="button">Nie</button>
        <div class="arrow" id="arrow">→</div>
      </div>
      <div class="result" id="result"></div>
    </main>
    <div class="bubble" id="bubble">to elo</div>

    <script>
      const question = document.getElementById("question");
      const yesBtn = document.getElementById("yesBtn");
      const noBtn = document.getElementById("noBtn");
      const answers = document.querySelector(".answers");
      const result = document.getElementById("result");
      const bubble = document.getElementById("bubble");
      const arrow = document.getElementById("arrow");
      let mode = "initial";
      let yesClicks = 0;

      function moveYesButton() {
        if (mode !== "initial") {
          return;
        }

        const padding = 8;
        const gap = 24;
        const area = answers.getBoundingClientRect();
        const button = yesBtn.getBoundingClientRect();
        const noButton = noBtn.getBoundingClientRect();
        const maxX = Math.max(padding, area.width - noButton.width - button.width - gap - padding);
        const maxY = Math.max(padding, area.height - button.height - padding);
        const x = padding + Math.random() * maxX;
        const y = padding + Math.random() * maxY;

        yesBtn.style.left = `${x}px`;
        yesBtn.style.top = `${y}px`;
        yesBtn.style.transform = "none";
      }

      function triggerEscape() {
        mode = "escape";
        const rect = yesBtn.getBoundingClientRect();
        yesBtn.style.position = "fixed";
        yesBtn.style.left = `${rect.left}px`;
        yesBtn.style.top = `${rect.top}px`;
        yesBtn.style.width = `${rect.width}px`;
        yesBtn.style.height = `${rect.height}px`;
        yesBtn.style.transform = "none";
        yesBtn.classList.add("escaped");
        bubble.style.right = "auto";
        bubble.style.left = `${Math.max(16, rect.left - 8)}px`;
        bubble.style.top = `${Math.max(16, rect.top - 56)}px`;
        bubble.classList.add("show");
        bubble.classList.add("ride");
        yesBtn.textContent = "Tak";
      }

      function lockYesButton() {
        yesBtn.style.position = "static";
        yesBtn.style.left = "auto";
        yesBtn.style.top = "auto";
        yesBtn.style.transform = "none";
        yesBtn.style.marginRight = "14px";
      }

      function clearEscapeState() {
        yesBtn.classList.remove("escaped");
        yesBtn.style.position = "static";
        yesBtn.style.left = "auto";
        yesBtn.style.top = "auto";
        yesBtn.style.width = "auto";
        yesBtn.style.height = "auto";
        yesBtn.style.transform = "none";
        yesBtn.style.marginRight = "14px";
        bubble.classList.remove("show", "ride");
        bubble.style.left = "";
        bubble.style.top = "";
        bubble.style.right = "";
        arrow.classList.remove("show");
      }

      function showFinalMessage() {
        question.textContent = "";
        answers.style.display = "none";
        result.textContent = "😊 To dawaj na cmika";
        result.classList.add("show");
      }

      moveYesButton();

      yesBtn.addEventListener("pointerdown", (event) => {
        if (mode !== "initial") {
          return;
        }

        event.preventDefault();
        yesClicks += 1;
        moveYesButton();

        if (yesClicks >= 4) {
          triggerEscape();
        }
      });

      yesBtn.addEventListener("mouseenter", () => {
        if (mode === "initial") {
          moveYesButton();
        }
      });

      yesBtn.addEventListener("focus", () => {
        if (mode === "initial") {
          moveYesButton();
        }
      });

      noBtn.addEventListener("click", () => {
        mode = "confirm";
        question.textContent = "Czy na pewno?";
        clearEscapeState();
        answers.classList.add("confirm");
        lockYesButton();
        noBtn.textContent = "Nie";
        noBtn.style.position = "static";
        noBtn.style.left = "auto";
        noBtn.style.top = "auto";
        noBtn.style.transform = "none";
      });

      yesBtn.addEventListener("click", () => {
        if (mode === "confirm") {
          showFinalMessage();
        }
      });

      window.addEventListener("resize", () => {
        if (mode === "initial") {
          moveYesButton();
        }
      });

      moveYesButton();
    </script>
  </body>
</html>
