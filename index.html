<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chwilowo wyłączone</title>
    <style>
      :root {
        color-scheme: dark;
        --bg1: #0f172a;
        --bg2: #111827;
        --card: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.14);
        --text: #f8fafc;
        --muted: rgba(248, 250, 252, 0.72);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(59, 130, 246, 0.18), transparent 30%),
          radial-gradient(circle at bottom right, rgba(244, 114, 182, 0.16), transparent 26%),
          linear-gradient(160deg, var(--bg1), var(--bg2));
      }

      .card {
        width: min(720px, 100%);
        padding: 40px;
        border-radius: 32px;
        border: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
        backdrop-filter: blur(18px);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.78rem;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2.4rem, 7vw, 4.8rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: clamp(1rem, 2.2vw, 1.15rem);
        line-height: 1.7;
      }

      @media (max-width: 520px) {
        .card {
          padding: 26px;
          border-radius: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">chwilowo wyłączone</div>
      <h1>Strona wróci później.</h1>
      <p>Na razie jest przerwa, więc nic tu nie działa.</p>
    </main>
  </body>
</html>
